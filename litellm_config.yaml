# =============================================================================
# LiteLLM Configuration - Fidus Memory System
# =============================================================================
# Letzte Aktualisierung: 2025-12-03
#
# MODELL-ÜBERSICHT:
#
# OPENAI GPT-4.1 FAMILIE (April 2025):
# - gpt-4.1:      Flagship. 54.6% SWE-bench, 1M Context. Best for: Coding, Agents
# - gpt-4.1-mini: Fast & günstig, übertrifft GPT-4o. Best for: General Chat, schnelle Tasks
# - gpt-4.1-nano: Ultraschnell, 80% MMLU. Best for: Classification, Autocomplete
#
# OPENAI REASONING (o-series):
# - o4-mini:      Bestes Reasoning (AIME 2024/2025 Rekord). Best for: Math, Logic, Code
# - o3-mini:      Enhanced Reasoning. Best for: Complex Problem Solving
#
# ANTHROPIC CLAUDE 4.5 (Sept-Nov 2025):
# - claude-opus-4.5:   Flagship, effizientester Token-Verbrauch. Best for: Long Agentic Tasks
# - claude-sonnet-4.5: "Best Coding Model", 1M Context. Best for: Coding, Computer Use
# - claude-haiku-4.5:  Schnellstes sicheres Modell. Best for: Fast Tasks, Budget
#
# ANTHROPIC CLAUDE 4:
# - claude-opus-4.1:   74.5% SWE-bench, Agentic Focus. Best for: Autonomous Tasks
# - claude-opus-4:     72.5% SWE-bench, 200K Context. Best for: Complex Reasoning
# - claude-sonnet-4:   Balanced Performance. Best for: General Purpose
#
# EMPFEHLUNGEN FÜR FIDUS MEMORY:
# - Chat:     gpt-4.1-mini, claude-haiku-4.5 (schnell, günstig)
# - Coding:   gpt-4.1, claude-sonnet-4.5 (beste Code-Qualität)
# - Agents:   claude-opus-4.5, gpt-4.1 (lange autonome Tasks)
# - Reasoning: o4-mini (Math, Logik)
# - Local:    llama3.3-70b-chat (Offline, Privacy)
#
# BENÖTIGTE ENV-VARIABLEN:
# - OPENAI_API_KEY=sk-...
# - ANTHROPIC_API_KEY=sk-ant-...
#
# FIDUS MEMORY AGENT-KONFIGURATION:
# Jeder Agent kann ein eigenes LLM-Modell verwenden:
#
# - FIDUS_LLM_MODEL=gpt-4.1-mini           # Default für alle Agents
# - FIDUS_CHAT_MODEL=gpt-4.1-mini          # Chat Agent (schnell, gutes Instruction Following)
# - FIDUS_CONTEXT_MODEL=gpt-4.1-nano       # Context Extraction (strukturierter Output)
# - FIDUS_PREFERENCE_MODEL=gpt-4.1-mini    # Preference Learning (gutes Verständnis)
# - FIDUS_REASONING_MODEL=o4-mini          # Reasoning Tasks (Math, Logik)
# - FIDUS_EMBEDDING_MODEL=bge-m3           # Embeddings (Vektor-Suche)
#
# - OPENAI_API_BASE=http://192.168.10.32:4000  # LiteLLM Proxy URL
# =============================================================================

model_list:
  # ============================================
  # OpenAI GPT-4.1 Family (April 2025)
  # Beste Wahl für Coding & Instruction Following
  # ============================================

  # GPT-4.1: Flagship Model
  # - 54.6% SWE-bench (vs 33.2% GPT-4o)
  # - 1M Token Context
  # - Optimiert für: Coding, Agents, Web Dev
  - model_name: gpt-4.1
    litellm_params:
      model: openai/gpt-4.1
      api_key: os.environ/OPENAI_API_KEY
      stream: true
      timeout: 120

  # GPT-4.1-mini: Schnell & Günstig
  # - Übertrifft GPT-4o in vielen Benchmarks
  # - 83% günstiger, 50% schneller als GPT-4o
  # - Optimiert für: General Chat, schnelle Tasks
  - model_name: gpt-4.1-mini
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY
      stream: true
      timeout: 60

  # GPT-4.1-nano: Ultraschnell
  # - 80.1% MMLU, 50.3% GPQA
  # - Günstigstes OpenAI Modell
  # - Optimiert für: Classification, Autocomplete, Summarization
  - model_name: gpt-4.1-nano
    litellm_params:
      model: openai/gpt-4.1-nano
      api_key: os.environ/OPENAI_API_KEY
      stream: true
      timeout: 30

  # ============================================
  # OpenAI Reasoning Models (o-series)
  # Spezialisiert auf komplexes Denken
  # ============================================

  # o4-mini: Bestes Reasoning-Modell
  # - AIME 2024 & 2025 Rekord
  # - Optimiert für: Math, Coding, Visual Reasoning
  - model_name: o4-mini
    litellm_params:
      model: openai/o4-mini
      api_key: os.environ/OPENAI_API_KEY
      stream: true
      timeout: 180

  # o3-mini: Enhanced Reasoning
  # - Gute Balance zwischen Speed & Reasoning
  # - Optimiert für: Complex Problem Solving
  - model_name: o3-mini
    litellm_params:
      model: openai/o3-mini
      api_key: os.environ/OPENAI_API_KEY
      stream: true
      timeout: 180

  # ============================================
  # OpenAI Legacy Models (GPT-4o)
  # Noch verfügbar, aber GPT-4.1 bevorzugen
  # ============================================

  # GPT-4o: Multimodal (Audio/Vision/Text)
  # - Einziges Modell mit Audio I/O
  # - Optimiert für: Real-time Voice, Vision Tasks
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      stream: true
      timeout: 120

  # GPT-4o-mini: Legacy Fast Model
  # - Ersetzt durch gpt-4.1-mini
  # - Optimiert für: Backward Compatibility
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      stream: true
      timeout: 60

  # ============================================
  # Anthropic Claude 4.5 Family (Sept-Nov 2025)
  # Aktuellste Claude Generation
  # ============================================

  # Claude Opus 4.5: Flagship (Nov 2025)
  # - Effizientester Token-Verbrauch
  # - Beste sustained reasoning
  # - Optimiert für: Long-horizon Agentic Tasks, Multi-Step Execution
  - model_name: claude-opus-4.5
    litellm_params:
      model: anthropic/claude-opus-4-5-20251101
      api_key: os.environ/ANTHROPIC_API_KEY
      stream: true
      timeout: 180

  # Claude Sonnet 4.5: Best Coding Model (Sept 2025)
  # - "Best coding model in the world"
  # - "Best model for agents"
  # - 1M Token Context (mit Beta Header)
  # - Optimiert für: Coding, Agents, Computer Use
  - model_name: claude-sonnet-4.5
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY
      stream: true
      timeout: 120

  # Claude Haiku 4.5: Fast & Safe (Okt 2025)
  # - Coding-Performance wie Sonnet 4, 1/3 Preis, 2x Speed
  # - Sichertes Modell (niedrigste Misalignment-Rate)
  # - $1/$5 per Million Tokens
  # - Optimiert für: Fast Tasks, Budget-conscious, Safety-critical
  - model_name: claude-haiku-4.5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      stream: true
      timeout: 60

  # ============================================
  # Anthropic Claude 4 Family (Mai-Aug 2025)
  # Vorherige Generation, noch sehr leistungsfähig
  # ============================================

  # Claude Opus 4.1: Agentic Specialist (Aug 2025)
  # - 74.5% SWE-bench Verified
  # - Optimiert für: Agentic Tasks, Real-world Coding
  - model_name: claude-opus-4.1
    litellm_params:
      model: anthropic/claude-opus-4-1-20250805
      api_key: os.environ/ANTHROPIC_API_KEY
      stream: true
      timeout: 180

  # Claude Opus 4: Original Flagship (Mai 2025)
  # - 72.5% SWE-bench, 200K Context
  # - Optimiert für: Complex Reasoning, Long Documents
  - model_name: claude-opus-4
    litellm_params:
      model: anthropic/claude-opus-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY
      stream: true
      timeout: 180

  # Claude Sonnet 4: Balanced (Mai 2025)
  # - Gute Balance Preis/Leistung
  # - Optimiert für: General Purpose, Everyday Tasks
  - model_name: claude-sonnet-4
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY
      stream: true
      timeout: 120

  # ============================================
  # Local Ollama Models
  # Für Offline-Nutzung & Privacy
  # ============================================

  # Llama 3.3 70B: Best Local Function Calling
  # - BFCL 77.3%
  # - Optimiert für: Tool Use, Offline Privacy
  - model_name: llama3.3-70b-chat
    litellm_params:
      model: ollama/llama3.3:70b
      api_base: http://localhost:11434
      stream: true
      timeout: 300

  # Qwen3 30B Chat: Extended Context
  # - 131K Context Window
  # - Optimiert für: Long Documents, Offline
  - model_name: qwen3-30b-chat
    litellm_params:
      model: ollama/qwen3:30b-ctx131k
      api_base: http://localhost:11434
      stream: true
      timeout: 240

  - model_name: qwen3-30b
    litellm_params:
      model: ollama/qwen3:30b
      api_base: http://localhost:11434
      stream: true
      timeout: 180

  # Qwen3 Coder: Local Coding Specialist
  # - Optimiert für: Offline Code Generation
  - model_name: qwen3-coder-30b
    litellm_params:
      model: ollama/qwen3-coder-30b-local:latest
      api_base: http://localhost:11434
      stream: true
      timeout: 240

  - model_name: qwen3-coder
    litellm_params:
      model: ollama/qwen3-coder:latest
      api_base: http://localhost:11434
      stream: true
      timeout: 120

  - model_name: qwen3-coder-30b-base
    litellm_params:
      model: ollama/qwen3-coder:30b
      api_base: http://localhost:11434
      stream: true
      timeout: 180

  - model_name: qwen2.5-coder-14b
    litellm_params:
      model: ollama/qwen2.5-coder:14b
      api_base: http://localhost:11434
      stream: true
      timeout: 120

  # ============================================
  # Embedding Models
  # Für Vektor-Suche & Semantic Search
  # ============================================

  # BGE-M3: Multilingual Embeddings
  # - Optimiert für: Semantic Search, RAG
  - model_name: bge-m3
    litellm_params:
      model: ollama/bge-m3:latest
      api_base: http://localhost:11434
      timeout: 60

  # Nomic Embed: Fast Embeddings
  # - Optimiert für: Quick Embedding Tasks
  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text:latest
      api_base: http://localhost:11434
      timeout: 60

# =============================================================================
# Global LiteLLM Settings
# =============================================================================
litellm_settings:
  # Performance optimizations
  drop_params: true
  set_verbose: false
  num_retries: 3
  request_timeout: 240

  # Parallel request handling (M4 Pro optimiert)
  max_parallel_requests: 16

  # Redis Caching
  cache: true
  cache_params:
    type: redis
    host: localhost
    port: 6379
    ttl: 3600  # 1 Stunde

  # ==========================================================================
  # Fallback Chains
  # Bei Fehler wird automatisch das nächste Modell versucht
  # ==========================================================================
  fallbacks:
    # GPT-4.1 -> Claude -> Local
    - gpt-4.1: [claude-opus-4.5, claude-sonnet-4.5, llama3.3-70b-chat]
    - gpt-4.1-mini: [claude-haiku-4.5, gpt-4o-mini, qwen3-30b-chat]
    - gpt-4.1-nano: [claude-haiku-4.5, gpt-4o-mini]

    # Claude -> GPT -> Local
    - claude-opus-4.5: [gpt-4.1, claude-opus-4.1, llama3.3-70b-chat]
    - claude-sonnet-4.5: [gpt-4.1, claude-sonnet-4, llama3.3-70b-chat]
    - claude-haiku-4.5: [gpt-4.1-mini, gpt-4o-mini, qwen3-30b-chat]

    # Reasoning -> General
    - o4-mini: [gpt-4.1, claude-sonnet-4.5]
    - o3-mini: [o4-mini, gpt-4.1]

    # Local -> Cloud (bei Ollama-Ausfall)
    - llama3.3-70b-chat: [gpt-4.1-mini, claude-haiku-4.5]
    - qwen3-30b-chat: [gpt-4.1-mini, claude-haiku-4.5, qwen3-30b]
    - qwen3-coder-30b: [gpt-4.1-mini, qwen3-30b-chat]

# Server settings
host: 0.0.0.0
port: 4000
